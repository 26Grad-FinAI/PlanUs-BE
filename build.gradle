plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.15'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '7.0.4'
}

group = 'com.planus'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'net.javacrumbs.shedlock:shedlock-spring:6.9.1'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.9.1'
}

dependencyManagement {
	imports {
		mavenBom "org.testcontainers:testcontainers-bom:1.21.1"
	}
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'benchmark', 'llm'
	}
	testLogging {
		showStandardStreams = project.hasProperty('showTestOutput')
	}
	jvmArgs '-XX:+EnableDynamicAgentLoading', '-Xshare:off'
}

// 실제 LLM API를 호출하는 테스트 — ANTHROPIC_API_KEY 환경변수 필요
// 실행: ./gradlew testLlm
tasks.register('testLlm', Test) {
	useJUnitPlatform {
		includeTags 'llm'
	}
	testLogging {
		showStandardStreams = true
	}
}

spotless {
	java {
		palantirJavaFormat()
		target 'src/**/*.java'
	}
}
