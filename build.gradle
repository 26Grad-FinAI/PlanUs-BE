plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.15'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '7.0.4'
}

group = 'com.planus'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation platform('org.springframework.ai:spring-ai-bom:1.0.0')
	implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'com.anthropic:anthropic-java:3.3.0' // LLM 판정기 (#140, 테스트 전용)
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	implementation 'me.paulschwarz:spring-dotenv:4.0.0'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	implementation 'com.google.api-client:google-api-client:2.9.1'
	implementation 'com.google.firebase:firebase-admin:9.4.3'

	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'net.javacrumbs.shedlock:shedlock-spring:6.9.1'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.9.1'
}

dependencyManagement {
	imports {
		mavenBom "org.testcontainers:testcontainers-bom:1.21.1"
	}
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'benchmark', 'llm'
	}
	testLogging {
		showStandardStreams = project.hasProperty('showTestOutput')
	}
	jvmArgs '-XX:+EnableDynamicAgentLoading', '-Xshare:off'
}

tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}

tasks.named('jar') {
	enabled = false
}

// 실제 LLM API를 호출하는 테스트 — ANTHROPIC_API_KEY 환경변수 필요
// 실행: ./gradlew testLlm
tasks.register('testLlm', Test) {
	useJUnitPlatform {
		includeTags 'llm'
	}
	// 결과가 외부 LLM 응답·환경변수(ANTHROPIC_API_KEY, LLM_REPEAT)에 따라 달라지므로
	// Gradle이 UP-TO-DATE로 건너뛰지 않고 매번 실행한다 (#111)
	outputs.upToDateWhen { false }
	testLogging {
		showStandardStreams = true
	}
}

// 블라인드 판정 도구 (#140) — 측정 로그를 섞어 판정 시트로 내보내고(export), 판정 결과를 버전별로 집계(score)
// 예: ./gradlew judge -Pcmd=export -Pout=판정폴더 -Plogs="v3.0=a.log;v4.1=b.log"
tasks.register('judge', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.planus.backend.domain.aifeedback.eval.BlindJudging'
	workingDir = projectDir // LLM 판정기가 docs/ai-feedback/judging-rubric.md를 읽음
	javaLauncher = javaToolchains.launcherFor(java.toolchain) // 기본 JVM이 아닌 컴파일과 같은 21로 실행
	args = ['cmd', 'out', 'logs', 'kinds', 'subset', 'seed', 'dir', 'ids', 'title', 'judgeModel', 'effort', 'key', 'sheets', 'final', 'report']
			.findAll { project.hasProperty(it) }
			.collect { "${it}=${project.property(it)}".toString() }
}

spotless {
	java {
		palantirJavaFormat('2.57.0')
		target 'src/**/*.java'
	}
}
