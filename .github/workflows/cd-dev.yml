name: DEV CD

on:
  workflow_call:
    inputs:
      image_tag:
        description: ECR에 이미 업로드된 배포 대상 Git 커밋 SHA
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: ECR에 이미 업로드된 배포 대상 Git 커밋 SHA
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: dev-ec2-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: planus-backend
  SSM_PARAMETER_PATH: /planus/dev/app

jobs:
  deploy:
    name: ECR 이미지 DEV EC2 배포
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 배포 변수 확인
        env:
          AWS_DEV_CD_ROLE_ARN: ${{ vars.AWS_DEV_CD_ROLE_ARN }}
          PLANUS_DEV_EC2_INSTANCE_ID: ${{ vars.PLANUS_DEV_EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          test -n "$AWS_DEV_CD_ROLE_ARN" || { echo "GitHub 변수 AWS_DEV_CD_ROLE_ARN이 필요합니다." >&2; exit 1; }
          test -n "$PLANUS_DEV_EC2_INSTANCE_ID" || { echo "GitHub 변수 PLANUS_DEV_EC2_INSTANCE_ID가 필요합니다." >&2; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || {
            echo "image_tag은 40자리 Git 커밋 SHA여야 합니다." >&2
            exit 1
          }

          echo "배포 대상 Git 커밋: $IMAGE_TAG"

      - name: 배포 대상 커밋 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}
          persist-credentials: false

      - name: AWS OIDC 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEV_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 배포 이미지 확인
        id: image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          repository_uri="$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].repositoryUri' \
            --output text)"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            >/dev/null

          image_uri="${repository_uri}:${IMAGE_TAG}"
          echo "uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "ECR 배포 이미지 확인 완료: $image_uri"

      - name: EC2 배포 명령 전송
        id: send-command
        env:
          INSTANCE_ID: ${{ vars.PLANUS_DEV_EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail

          compose_b64="$(base64 --wrap=0 docker-compose.dev.yml)"
          nginx_b64="$(base64 --wrap=0 infra/nginx/planus-dev.conf)"
          deploy_b64="$(base64 --wrap=0 infra/ec2/deploy-dev.sh)"
          image_b64="$(printf '%s' "$IMAGE_URI" | base64 --wrap=0)"
          aws_region_b64="$(printf '%s' "$AWS_REGION" | base64 --wrap=0)"
          parameter_path_b64="$(printf '%s' "$SSM_PARAMETER_PATH" | base64 --wrap=0)"

          remote_command="$(cat <<'REMOTE_COMMAND'
          set -eu

          command -v flock >/dev/null 2>&1 || {
            echo "배포 잠금에 필요한 flock 명령어가 없습니다." >&2
            exit 1
          }
          exec 9>/var/lock/planus-dev-deploy.lock
          flock -n 9 || {
            echo "다른 DEV 배포가 실행 중이어서 배포를 시작하지 못했습니다." >&2
            exit 1
          }

          base_dir=/opt/planus
          compose_file="$base_dir/docker-compose.dev.yml"
          compose_next="${compose_file}.next"
          nginx_dir="$base_dir/infra/nginx"
          nginx_config="$nginx_dir/planus-dev.conf"
          nginx_next="${nginx_config}.next"
          deploy_dir="$base_dir/infra/ec2"
          deploy_script="$deploy_dir/deploy-dev.sh"
          deploy_next="${deploy_script}.next"

          install -d -m 0755 "$base_dir" "$nginx_dir" "$deploy_dir"

          printf '%s' '__COMPOSE_BASE64__' | base64 --decode > "$compose_next"
          printf '%s' '__NGINX_BASE64__' | base64 --decode > "$nginx_next"
          printf '%s' '__DEPLOY_BASE64__' | base64 --decode > "$deploy_next"

          if [ -f "$compose_file" ]; then
            cp "$compose_file" "${compose_file}.previous"
          fi
          if [ -f "$nginx_config" ]; then
            cp "$nginx_config" "${nginx_config}.previous"
          fi

          mv "$compose_next" "$compose_file"
          mv "$nginx_next" "$nginx_config"
          mv "$deploy_next" "$deploy_script"
          chmod 0700 "$deploy_script"

          export AWS_REGION="$(printf '%s' '__AWS_REGION_BASE64__' | base64 --decode)"
          export PLANUS_SSM_PARAMETER_PATH="$(printf '%s' '__PARAMETER_PATH_BASE64__' | base64 --decode)"
          export PLANUS_APP_IMAGE="$(printf '%s' '__IMAGE_BASE64__' | base64 --decode)"

          /usr/bin/env bash "$deploy_script"
          REMOTE_COMMAND
          )"

          remote_command="${remote_command/__COMPOSE_BASE64__/$compose_b64}"
          remote_command="${remote_command/__NGINX_BASE64__/$nginx_b64}"
          remote_command="${remote_command/__DEPLOY_BASE64__/$deploy_b64}"
          remote_command="${remote_command/__IMAGE_BASE64__/$image_b64}"
          remote_command="${remote_command/__AWS_REGION_BASE64__/$aws_region_b64}"
          remote_command="${remote_command/__PARAMETER_PATH_BASE64__/$parameter_path_b64}"

          jq -n --arg command "$remote_command" '{commands: [$command]}' > ssm-parameters.json
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters file://ssm-parameters.json \
            --comment "PlanUs DEV 이미지 ${IMAGE_URI##*:} 배포" \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM 배포 명령 전송 완료: $command_id"

      - name: EC2 배포 결과 확인
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
          INSTANCE_ID: ${{ vars.PLANUS_DEV_EC2_INSTANCE_ID }}
        run: |
          set -uo pipefail

          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text \
              2>/dev/null || echo "Pending")"
            echo "SSM 배포 명령 상태: $status ($attempt/60)"

            if [ "$status" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query '{status:Status, stdout:StandardOutputContent, stderr:StandardErrorContent}' \
                --output json
              exit 0
            fi

            if [[ "$status" =~ ^(Cancelled|Cancelling|Failed|TimedOut)$ ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query '{status:Status, stdout:StandardOutputContent, stderr:StandardErrorContent}' \
                --output json >&2
              exit 1
            fi

            sleep 10
          done

          echo "EC2 배포 명령이 10분 안에 완료되지 않았습니다." >&2
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{status:Status, stdout:StandardOutputContent, stderr:StandardErrorContent}' \
            --output json >&2 || true
          exit 1
