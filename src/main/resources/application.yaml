spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: none          # 스키마는 Flyway가 담당
    properties:
      hibernate:
        auto_quote_keyword: true

planus:
  ai:
    budget:
      base-url: ${RUNPOD_ENDPOINT:https://8gcw31a7figzda.api.runpod.ai}
      api-key: ${RUNPOD_API_KEY:}
      planus-token: ${PLANUS_TOKEN:}
  fcm:
    service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 3600000      # 1시간
    refresh-token-expiry: 1209600000  # 14일
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
    kakao:
      userinfo-uri: https://kapi.kakao.com/v2/user/me
      token-info-uri: https://kapi.kakao.com/v1/user/access_token_info
      app-id: ${KAKAO_APP_ID}