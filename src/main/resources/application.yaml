spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-5
          max-tokens: 800
    # ActionEnricher(Spring AI) 경로의 재시도 (#124). 기본값은 10회·최대 3분 대기라 배치를 오래 붙잡는다.
    # 429·5xx만 재시도하고(on-client-errors 기본 false), 그 밖의 4xx(크레딧·키 오류)는 바로 실패해 기본 actions로 폴백한다.
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
  # Spring AI가 쓰는 RestClient.Builder의 타임아웃 (다른 외부 호출은 각자 요청 팩토리에 따로 설정)
  http:
    client:
      connect-timeout: 5s
      read-timeout: 60s
  jpa:
    hibernate:
      ddl-auto: none          # 스키마는 Flyway가 담당
    properties:
      hibernate:
        auto_quote_keyword: true
  flyway:
    postgresql:
      # 기본값(true)이면 Flyway가 트랜잭션 advisory lock을 잡은 채 마이그레이션을 실행하여
      # V30의 CREATE INDEX CONCURRENTLY가 그 트랜잭션 종료를 무한 대기(교착)한다.
      # 세션 레벨 lock을 사용하도록 변경한다.
      transactional-lock: false

planus:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  ai:
    llm:
      api-key: ${ANTHROPIC_API_KEY:}
    budget:
      base-url: ${RUNPOD_ENDPOINT:https://8gcw31a7figzda.api.runpod.ai}
      api-key: ${RUNPOD_API_KEY:}
      planus-token: ${PLANUS_TOKEN:}
  fcm:
    service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 3600000      # 1시간
    refresh-token-expiry: 1209600000  # 14일
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
    kakao:
      userinfo-uri: https://kapi.kakao.com/v2/user/me
      token-info-uri: https://kapi.kakao.com/v1/user/access_token_info
      app-id: ${KAKAO_APP_ID}
