# ── PlanUs 설정 (Postgres) ──
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/planus
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        auto_quote_keyword: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

planus:
  ai:
    weekly-cron: "0 0 9 * * MON"
    llm:
      api-key: ${ANTHROPIC_API_KEY}
      model: claude-sonnet-4-5
      max-tokens: 600
    # [3] 이상치 탐지
    point-z: 3.5
    trend-ratio: 1.40
    high-freq-categories: [1, 6, 8, 10]
    baseline-weeks: 8
    # [3] 이상치 신뢰도 표본 기준
    conf-high-min-samples: 30
    conf-medium-min-samples: 15
    # [1.5] 활동성 가드
    activity-threshold: 0.50
    # [6] 절약 액션
    reduction-ratio: 0.50
    # [3.5] 메모 질문 큐
    weekly-question-cap: 3
    # 월말 검증 배치
    month-end-cron: "0 0 3 1 * *"
    # 카테고리 속성 (시스템 기본)
    category:
      essential: [5, 9, 15, 20]
      semi-essential: [1, 3, 7]
      spike-prone: [5, 20]
