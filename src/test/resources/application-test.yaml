spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}

planus:
  jwt:
    secret: test-secret-key-for-unit-testing-only-32chars
    access-token-expiry: 3600000
    refresh-token-expiry: 1209600000
  oauth2:
    google:
      client-id: test-client-id
      client-secret: test-client-secret
      token-uri: https://oauth2.googleapis.com/token
      userinfo-uri: https://www.googleapis.com/oauth2/v3/userinfo
      allowed-redirect-uris: http://localhost/callback
    kakao:
      client-id: test-client-id
      client-secret: test-client-secret
      token-uri: https://kauth.kakao.com/oauth/token
      userinfo-uri: https://kapi.kakao.com/v2/user/me
      allowed-redirect-uris: http://localhost/callback
